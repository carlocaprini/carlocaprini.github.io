title: "Carlo Caprini"
tagline: "Product leadership"
# Person fields (name, role, article_signature_role, linkedin) live in _data/person.yml
# so Liquid can read every key reliably (nested keys under person: in this file are not all exposed on site.person).
description: "Notes and curated paths on product decisions, software platforms, AI adoption, engineering collaboration, and complex systems."
url: "https://carlocaprini.github.io"
production_url: "https://carlocaprini.github.io"
baseurl: ""
timezone: Europe/Rome

google_analytics: G-F6G0HN1JDJ
google_analytics_hostname: carlocaprini.github.io
# Set only after the Worker and D1 database have been deployed and verified.
aggregate_analytics_endpoint: "https://carlo-site-aggregate-analytics.carlo-site-aggregate-analytics.workers.dev/v1/measure"

markdown: kramdown

permalink: pretty

collections:
  influences:
    output: false

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - GOAL.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - node_modules
  - package.json
  - package-lock.json
  - playwright.config.js
  - README.md
  - test-results
  - tests
  - _analytics
  - _workspace
  - _site
