name: Refresh canonical feed bridge

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: npm ci
      - name: Fetch and atomically validate the canonical feed
        run: ruby scripts/refresh_feed.rb legacy/feed.xml
      - run: bin/check source
      - run: bin/check generated
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy validated feed bridge artifact
        id: deployment
        uses: actions/deploy-pages@v5
