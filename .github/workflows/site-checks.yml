name: Site checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - house-cleaning
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate site
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Check Ruby syntax
        run: |
          ruby -c scripts/validate_source.rb
          ruby -c scripts/validate_site.rb

      - name: Validate source contracts
        run: ruby scripts/validate_source.rb

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter

      - name: Validate generated site
        run: ruby scripts/validate_site.rb

      - name: Upload generated site for browser jobs
        uses: actions/upload-artifact@v7
        with:
          name: generated-site-${{ github.sha }}
          path: _site
          if-no-files-found: error
          retention-days: 1

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  analytics:
    name: Analytics
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install analytics dependencies
        run: npm ci

      - name: Test aggregate measurement collector
        run: npm run test:analytics

      - name: Test local aggregate measurement integration
        run: npm run test:analytics:integration

  infrastructure:
    name: Infrastructure
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: docker compose config

  browser-chromium:
    name: Chromium
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download generated site
        uses: actions/download-artifact@v8
        with:
          name: generated-site-${{ github.sha }}
          path: _site

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium browser checks
        run: npm run test:browser

      - name: Upload Chromium failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-chromium-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  browser-webkit:
    name: WebKit
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download generated site
        uses: actions/download-artifact@v8
        with:
          name: generated-site-${{ github.sha }}
          path: _site

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install WebKit
        run: npx playwright install --with-deps webkit

      - name: Run WebKit smoke checks
        run: npm run test:browser:webkit

      - name: Upload WebKit failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-webkit-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  visual:
    name: Visual regression
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download generated site
        uses: actions/download-artifact@v8
        with:
          name: generated-site-${{ github.sha }}
          path: _site

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run visual regression checks
        run: npm run test:browser:visual

      - name: Upload visual failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - validate
      - analytics
      - infrastructure
      - browser-chromium
      - browser-webkit
      - visual
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
