name: Site checks

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-site:
    name: Build and validate site
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Check Ruby syntax
        run: |
          ruby -c scripts/validate_source.rb
          ruby -c scripts/validate_site.rb

      - name: Validate source contracts
        run: ruby scripts/validate_source.rb

      - name: Configure GitHub Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v6

      - name: Build Jekyll site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter

      - name: Validate generated site
        run: ruby scripts/validate_site.rb

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install browser-test dependencies
        run: npm ci

      - name: Test aggregate measurement collector
        run: npm run test:analytics

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Test local aggregate measurement integration
        run: npm run test:analytics:integration

      - name: Run Chromium browser checks
        run: npm run test:browser

      - name: Run WebKit smoke checks
        run: npm run test:browser:webkit

      - name: Run visual regression checks
        run: npm run test:browser:visual

      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Validate Docker Compose
        run: docker compose config

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs:
      - validate-site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
