name: Visual documentation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify visual documentation structure
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify committed visual documentation
        run: bin/check visual-docs
