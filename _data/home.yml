where_i_can_help:
  eyebrow: Working together
  title: Problems I can help work through.
  paragraphs:
    - The same questions I write about often appear in real product and engineering work.
    - I am open to selected collaborations where an external product perspective can help clarify direction, expose trade-offs or connect product and technical decisions.
  cards:
    - title: Product direction when several options look reasonable
      body: Clarifying what each direction protects, what it gives up and which information is still missing.
    - title: Platform and API product evolution
      body: Connecting customer and developer experience with technical constraints, extensibility and long-term platform health.
    - title: AI adoption in existing products and workflows
      body: Moving from a promising capability to useful, dependable behaviour with explicit ownership and boundaries.
  actions:
    - label: See my experience
      url: /experience/
    - label: Start a conversation
      url: /#contact

