where_i_can_help:
  eyebrow: Where I can help
  title: Problems I occasionally help teams work through.
  paragraphs:
    - Alongside my product work, I occasionally collaborate with software companies when an independent Product & Engineering perspective can help clarify a difficult problem.
    - I focus on specific problems with a clear scope, using product context and technical evidence to clarify what matters, what should change, what can wait and what is already working well enough to preserve.
  cards:
    - title: Product & Engineering direction
      body: When a product, platform or API can evolve in several reasonable directions and the difficult part is understanding the trade-offs, technical constraints, compatibility and consequences.
    - title: Software delivery and engineering systems
      body: When architecture, testing, release practices or development workflows are making software harder to change safely and predictably.
    - title: AI adoption and AI-assisted development
      body: When a team is trying to move from experimenting with AI to using it reliably in products or development workflows.
  actions:
    - label: See how I work
      url: /work/

