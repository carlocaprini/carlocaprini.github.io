product-judgment-in-practice:
  title: Product Judgment in Practice
  short_title: Product judgment
  url: /series/product-judgment-in-practice/
  meta_image: /assets/og-product-judgment-series-v1.png
  meta_image_alt: Product Judgment in Practice by Carlo Caprini, a series about information, trade-offs, timing, commitment and alignment in product decisions.
  tagline: How product decisions get made when information is incomplete and every option has a cost.
  listing_description: Evidence, trade-offs, urgency, timing and disagreement before implementation begins.
  description: >
    Product work rarely presents one obviously correct answer. The difficult part is usually deciding with incomplete information, competing pressures and consequences that may only become visible later. This series follows the judgment behind those decisions.
  context: >
    Product decisions are often treated as exercises in prioritization or solution selection. I find the harder work happens earlier: understanding what is actually known, what each option gives up, how urgent the decision really is, and how difficult it will be to change course later.
  entry_context: This series follows the judgment behind product decisions, from evidence and trade-offs to timing, commitment and disagreement.
  topics:
    - product-decisions
    - teams-and-collaboration
  overview:
    eyebrow: The decision loop
    title: Better product decisions start before prioritization.
    paragraphs:
      - A prioritization score cannot compensate for missing context. Before comparing options, teams need to understand the problem, the evidence available, the constraints around it and what each path would make easier or harder later.
      - The notes in this series follow that decision loop. They begin with information and trade-offs, move through urgency and timing, and end with the work of creating enough shared understanding for a team to commit.
    items:
      - title: Information
        description: What do we know, what is missing, and which assumptions are carrying the decision?
      - title: Trade-offs
        description: What does each reasonable option protect, and what does it make harder?
      - title: Timing
        description: Is the decision actually urgent, or would waiting create better information and more options?
      - title: Commitment
        description: What becomes costly to reverse once customers, teams or systems depend on the choice?
      - title: Alignment
        description: Can the team move forward without pretending every perspective has become the same?
  article_context:
    show_related_reading: true

building-my-ai-operating-system:
  title: Building My Own AI Operating System
  short_title: AI Operating System
  url: /series/building-my-ai-operating-system/
  meta_image: /assets/og-ai-operating-system-series-v1.png
  meta_image_alt: Building My Own AI Operating System by Carlo Caprini, illustrated as colorful connected services converging into one system.
  tagline: From one general assistant to smaller services with clearer jobs, boundaries and ownership.
  listing_description: A first-person series about moving from one general assistant to smaller AI-first services with explicit jobs, boundaries and ownership.
  description: My notes from building a personal AI-first operating system, starting with the failed attempt to make one general assistant useful.
  context: The series follows the decisions, boundaries and failure modes that appear as separate tools begin to form a system that can work across them.
  entry_context: After abandoning a general Jarvis-like assistant, I started building smaller AI-first services around recurring work and connecting them only when a concrete coordination problem appeared.
  topics:
    - ai-and-automation
    - software-systems
  overview:
    eyebrow: The system so far
    title: Separate services, explicit responsibilities.
    paragraphs:
      - This series follows my attempt to build a personal AI operating system by starting from work I already do, rather than from one universal assistant.
      - August keeps documents, versions and review state together. March makes the publishing runway visible without turning it into a commitment. Friday now coordinates signals across them while each service remains responsible for its own work.
  article_context:
    show_related_reading: false
  services:
    - name: Jarvis
      slug: jarvis
      concept: Failed attempt
      url: /thinking/i-stopped-trying-to-build-jarvis/
      sidebar_description: Failed general-assistant attempt without a recurring job.
      description: A general orchestration system that began with decisions and action items before it had a recurring job.
    - name: August
      slug: august
      concept: Document continuity
      url: /thinking/i-built-august-because-copy-and-paste-was-not-collaboration/
      sidebar_description: Documents, versions and review state.
      description: A private, local review workspace for developing documents with AI while keeping versions, review state and unresolved questions visible.
    - name: March
      slug: march
      concept: Editorial runway
      url: /thinking/i-built-march-to-plan-with-ai-without-becoming-a-content-machine/
      sidebar_description: Publishing runway, planned slots and intentional gaps.
      description: A view of what may be published, what is ready and where intentional gaps remain, without turning the plan into a promise.
    - name: Friday
      slug: friday
      concept: Working orchestrator
      url: /thinking/why-i-started-building-friday/
      sidebar_description: Attention layer coordinating signals across services.
      description: The ongoing second attempt, built around noticing what may deserve attention across bounded services without replacing them.
  visual_section:
    eyebrow: From the notes
    title: A few views of the system.
    description: Screenshots from August, March and Friday, collected as the interfaces changed across the series.
    note: Interface views use public or fictional demonstration data. No private document content is shown.
  visuals:
    - episode: "02"
      service: August
      title: Document continuity
      description: A draft, its current version and two review threads remain part of the same piece of work.
      thumbnail: /assets/series-august-document-continuity.webp
      thumbnail_width: 800
      thumbnail_height: 469
      full_image: /assets/august-document-continuity-public-demo.png
      note_url: /thinking/i-built-august-because-copy-and-paste-was-not-collaboration/
      alt: August document workspace showing a current version and two fictional review threads between Carlo and an AI reviewer.
    - episode: "03"
      service: March
      title: The publishing runway
      description: Planned, published and intentionally empty slots stay visible across the coverage horizon.
      thumbnail: /assets/series-march-publishing-runway.webp
      thumbnail_width: 800
      thumbnail_height: 312
      full_image: /assets/march-publishing-runway-july-2026.png
      note_url: /thinking/i-built-march-to-plan-with-ai-without-becoming-a-content-machine/
      alt: March coverage horizon showing published, planned and available publishing slots across five months.
    - episode: "04"
      service: Friday
      title: The Morning Bridge
      description: Signals from separate services meet in one attention queue.
      thumbnail: /assets/series-friday-morning-bridge.webp
      thumbnail_width: 1280
      thumbnail_height: 750
      full_image: /assets/friday-morning-bridge-public-demo.png
      note_url: /thinking/why-i-started-building-friday/
