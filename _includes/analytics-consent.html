<aside class="consent-panel" id="analytics-consent" aria-labelledby="analytics-consent-title" hidden>
  <div class="consent-panel-copy">
    <div class="section-eyebrow">Optional analytics</div>
    <h2 id="analytics-consent-title">Help me understand how the site is used</h2>
    <p>I use Google Analytics only to understand which notes and paths are useful. It stays off unless you accept. Read more in the <a href="{{ '/privacy/' | relative_url }}">Privacy details</a>.</p>
  </div>
  <div class="consent-panel-actions">
    <button class="consent-choice" type="button" data-consent-choice="denied">No thanks</button>
    <button class="consent-choice consent-choice--accept" type="button" data-consent-choice="granted">Accept analytics</button>
  </div>
</aside>
